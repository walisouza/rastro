[build]
  command = "npm run build"
  publish = "public"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pg-native"]

[[headers]]
  for = "/t.js"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
